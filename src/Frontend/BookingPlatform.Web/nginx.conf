server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-fallback: любой путь без файла отдаёт index.html (callback после Keycloak идёт на "/")
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статику кэшируем
    location ~* \.(js|css|png|jpe?g|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }
}
